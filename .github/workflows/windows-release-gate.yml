name: TAHRIR Windows Release Gate

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run contract:check
      - run: npm run qa:static
      - run: npm run build

      - working-directory: src-tauri
        run: cargo check --locked

      - working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1

      - name: Vendor OCR runtime (Tesseract/Poppler/tessdata)
        run: pwsh -File scripts/vendor-ocr-runtime.ps1

      - name: Verify OCR runtime files are present
        run: |
          $paths = @(
            "src-tauri\resources\ocr\vendor\tesseract\tesseract.exe",
            "src-tauri\resources\ocr\vendor\poppler\pdftotext.exe",
            "src-tauri\resources\ocr\vendor\poppler\pdftoppm.exe",
            "src-tauri\resources\ocr\tessdata\heb.traineddata",
            "src-tauri\resources\ocr\tessdata\ara.traineddata",
            "src-tauri\resources\ocr\tessdata\eng.traineddata"
          )
          foreach ($p in $paths) {
            if (!(Test-Path $p)) { throw "missing OCR runtime file: $p" }
          }
          Write-Host "All OCR runtime files present."

      - run: npm run desktop:build

      - name: Report where OCR runtime files landed in the release build output
        run: |
          Write-Host "Searching src-tauri\target\release for OCR runtime files..."
          $found = Get-ChildItem -Recurse "src-tauri\target\release" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("tesseract.exe","pdftotext.exe","pdftoppm.exe","heb.traineddata","ara.traineddata","eng.traineddata") }
          if (!$found -or $found.Count -eq 0) {
            Write-Warning "No OCR runtime files found anywhere under target\release. Gate C's 'verify final Tauri bundle contains all required runtime files' is NOT yet satisfied - this needs investigation, not a passing build."
          } else {
            Write-Host "Found OCR runtime files under target\release:"
            $found | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tahrir-windows-installer-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
          if-no-files-found: error
          retention-days: 14
